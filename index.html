<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Target 100 — Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Target 100 — web app. Self-contained, offline-first.
   Palette: deep teal + amber (warm, energetic, exam-prep friendly)
   ============================================================ */
:root{
  --font-body:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --bg:#f5f7f4;
  --bg-grad-1:rgba(13,148,136,0.07);
  --bg-grad-2:rgba(217,119,6,0.06);
  --surface:#ffffff;
  --surface-2:#eef2ee;
  --surface-3:#e6ebe6;
  --border:rgba(16,32,28,0.10);
  --border-strong:rgba(16,32,28,0.18);
  --text:#13201c;
  --text-dim:#5a6b64;
  --text-faint:#8a978f;

  --primary:#0f766e;
  --primary-strong:#0b5a54;
  --primary-dim:rgba(15,118,110,0.12);
  --primary-ink:#ffffff;
  --accent:#d97706;
  --accent-dim:rgba(217,119,6,0.14);

  --good:#15803d;
  --good-dim:rgba(21,128,61,0.13);
  --bad:#b91c1c;
  --bad-dim:rgba(185,28,28,0.12);
  --warn:#b45309;
  --warn-dim:rgba(180,83,9,0.14);
  --info:#0369a1;
  --info-dim:rgba(3,105,161,0.12);

  --radius:16px;
  --radius-sm:11px;
  --radius-lg:22px;
  --shadow-1:0 1px 2px rgba(16,32,28,0.06), 0 1px 3px rgba(16,32,28,0.05);
  --shadow-2:0 6px 20px -8px rgba(16,32,28,0.22), 0 2px 6px rgba(16,32,28,0.06);
  --shadow-3:0 24px 60px -24px rgba(16,32,28,0.4);
  --sidebar-w:264px;
  --topbar-h:62px;
}
html[data-theme="dark"]{
  --bg:#0e1614;
  --bg-grad-1:rgba(45,212,191,0.08);
  --bg-grad-2:rgba(251,191,36,0.05);
  --surface:#16201d;
  --surface-2:#1d2824;
  --surface-3:#243029;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);
  --text:#e9f0ec;
  --text-dim:#9fb0a8;
  --text-faint:#748079;
  --primary:#2dd4bf;
  --primary-strong:#5eead4;
  --primary-dim:rgba(45,212,191,0.15);
  --primary-ink:#04211d;
  --accent:#fbbf24;
  --accent-dim:rgba(251,191,36,0.16);
  --good:#4ade80;
  --good-dim:rgba(74,222,128,0.14);
  --bad:#f87171;
  --bad-dim:rgba(248,113,113,0.14);
  --warn:#fbbf24;
  --warn-dim:rgba(251,191,36,0.15);
  --info:#38bdf8;
  --info-dim:rgba(56,189,248,0.14);
  --shadow-1:0 1px 2px rgba(0,0,0,0.4);
  --shadow-2:0 8px 24px -10px rgba(0,0,0,0.6);
  --shadow-3:0 24px 60px -24px rgba(0,0,0,0.8);
}
/* accent presets (user-selectable) */
html[data-accent="amber"]{--primary:#b45309;--primary-strong:#92400e;--primary-dim:rgba(180,83,9,0.13);--primary-ink:#fff;}
html[data-theme="dark"][data-accent="amber"]{--primary:#fbbf24;--primary-strong:#fcd34d;--primary-dim:rgba(251,191,36,0.16);--primary-ink:#3a2503;}
html[data-accent="rose"]{--primary:#be123c;--primary-strong:#9f1239;--primary-dim:rgba(190,18,60,0.12);--primary-ink:#fff;}
html[data-theme="dark"][data-accent="rose"]{--primary:#fb7185;--primary-strong:#fda4af;--primary-dim:rgba(251,113,133,0.16);--primary-ink:#3d0513;}
html[data-accent="blue"]{--primary:#1d4ed8;--primary-strong:#1e40af;--primary-dim:rgba(29,78,216,0.12);--primary-ink:#fff;}
html[data-theme="dark"][data-accent="blue"]{--primary:#60a5fa;--primary-strong:#93c5fd;--primary-dim:rgba(96,165,250,0.16);--primary-ink:#0a1a3d;}
html[data-accent="green"]{--primary:#15803d;--primary-strong:#166534;--primary-dim:rgba(21,128,61,0.13);--primary-ink:#fff;}
html[data-theme="dark"][data-accent="green"]{--primary:#4ade80;--primary-strong:#86efac;--primary-dim:rgba(74,222,128,0.16);--primary-ink:#052e13;}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -8%, var(--bg-grad-1), transparent 62%),
    radial-gradient(760px 460px at 100% 0%, var(--bg-grad-2), transparent 58%);
}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:700;letter-spacing:-0.01em;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--primary);}
.mono{font-family:var(--font-mono);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:content-box;}

/* ---------- app shell ---------- */
#app{min-height:100vh;}
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:40;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border);
}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:12px;border:1px solid transparent;
  background:transparent;cursor:pointer;color:var(--text-dim);flex:0 0 auto;
  transition:background .15s,color .15s,transform .1s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn:active{transform:scale(0.94);}
.icon-btn svg{width:21px;height:21px;display:block;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-0.02em;font-size:17px;margin-left:2px;}
.brand .logo{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--primary),var(--primary-strong));
  display:grid;place-items:center;color:var(--primary-ink);font-family:var(--font-mono);
  font-weight:600;font-size:13px;box-shadow:var(--shadow-1);
}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--text-faint);letter-spacing:0.04em;text-transform:uppercase;}
.topbar .spacer{flex:1;}
.top-right{display:flex;align-items:center;gap:6px;}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-dim);
  border:1px solid var(--border);
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
.pill.offline .dot{background:var(--bad);}
.pill.hide{display:none;}
.lang-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px;}
.lang-toggle button{border:0;background:transparent;padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;color:var(--text-dim);}
.lang-toggle button.on{background:var(--primary);color:var(--primary-ink);}

.sidebar{
  position:fixed;top:0;bottom:0;left:0;width:var(--sidebar-w);z-index:50;
  background:var(--surface);border-right:1px solid var(--border);
  padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
  transform:translateX(-104%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
body.nav-open .sidebar{transform:translateX(0);box-shadow:var(--shadow-3);}
.sidebar .side-head{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  cursor:pointer;color:var(--text-dim);font-weight:600;font-size:14px;border:1px solid transparent;
  transition:background .14s,color .14s;width:100%;text-align:left;background:transparent;
}
.nav-item svg{width:20px;height:20px;flex:0 0 auto;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--primary-dim);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 26%, transparent);}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-dim);}
.nav-item.active .badge{background:var(--primary);color:var(--primary-ink);}
.side-foot{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--text-faint);border-top:1px solid var(--border);}
.scrim{position:fixed;inset:0;background:rgba(6,12,10,0.5);z-index:45;opacity:0;visibility:hidden;transition:.25s;}
body.nav-open .scrim{opacity:1;visibility:visible;}

main{padding:calc(var(--topbar-h) + 20px) 16px 90px;max-width:1120px;margin:0 auto;}
@media(min-width:1024px){
  .sidebar{transform:translateX(0);}
  body.nav-open .sidebar{box-shadow:none;}
  .scrim{display:none;}
  main{margin-left:var(--sidebar-w);max-width:calc(1120px + var(--sidebar-w));padding-left:34px;padding-right:34px;}
  .topbar{left:var(--sidebar-w);}
  #hamburger{display:none;}
}
.view-head{margin-bottom:20px;}
.view-head h1{font-size:26px;}
.view-head p{margin:5px 0 0;color:var(--text-dim);font-size:14px;}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1);}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.row{display:flex;gap:12px;align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.section-label{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);
  font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);
  margin:26px 0 12px;
}
.section-label::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);}
.section-label:first-child{margin-top:0;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-weight:600;font-size:14px;cursor:pointer;
  transition:transform .08s,background .14s,border-color .14s,box-shadow .14s;white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2);}
.btn:active{transform:scale(0.97);}
.btn svg{width:17px;height:17px;}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;box-shadow:var(--shadow-1);}
.btn.primary:hover{background:var(--primary-strong);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent);}
.btn.danger:hover{background:var(--bad-dim);}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.block{width:100%;}

label.field{display:block;margin-bottom:14px;}
label.field > span{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.01em;}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);outline:none;transition:border-color .14s,box-shadow .14s,background .14s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim);background:var(--surface);}
textarea{resize:vertical;min-height:80px;line-height:1.5;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px;}
.help{font-size:12px;color:var(--text-faint);margin-top:6px;line-height:1.45;}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap;}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--text-dim);}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-1);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-dim);}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent;}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:0.01em;}
.tag.gray{background:var(--surface-3);color:var(--text-dim);}
.tag.green{background:var(--good-dim);color:var(--good);}
.tag.red{background:var(--bad-dim);color:var(--bad);}
.tag.amber{background:var(--warn-dim);color:var(--warn);}
.tag.blue{background:var(--info-dim);color:var(--info);}
.tag.teal{background:var(--primary-dim);color:var(--primary);}

.stat{padding:16px 17px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);}
.stat .k{font-size:12px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-0.03em;margin-top:6px;font-family:var(--font-mono);}
.stat .s{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
.stat.hero{background:linear-gradient(150deg,var(--primary-dim),transparent 70%);border-color:color-mix(in srgb,var(--primary) 24%,transparent);}
.stat.hero .v{color:var(--primary);}

.progress{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.progress > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-strong));transition:width .5s cubic-bezier(.4,0,.2,1);}
.progress.amber > i{background:linear-gradient(90deg,var(--accent),#f59e0b);}
.progress.green > i{background:linear-gradient(90deg,var(--good),#22c55e);}

.list-item{
  display:flex;align-items:flex-start;gap:13px;padding:14px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);margin-bottom:9px;transition:border-color .14s,box-shadow .14s;
}
.list-item:hover{border-color:var(--border-strong);box-shadow:var(--shadow-1);}
.list-item .li-main{flex:1;min-width:0;}
.list-item h4{font-size:14.5px;font-weight:700;}
.list-item .meta{font-size:12.5px;color:var(--text-dim);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
.list-item .li-actions{display:flex;gap:6px;flex-shrink:0;}

.empty{text-align:center;padding:44px 20px;color:var(--text-dim);}
.empty svg{width:46px;height:46px;color:var(--text-faint);margin-bottom:12px;}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--text);}
.empty p{font-size:13.5px;margin:0 auto;max-width:420px;}

.modal-scrim{position:fixed;inset:0;background:rgba(6,12,10,0.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;visibility:hidden;transition:.2s;}
.modal-scrim.open{opacity:1;visibility:visible;}
@media(min-width:640px){.modal-scrim{align-items:center;padding:24px;}}
.modal{
  background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:1px solid var(--border);
  box-shadow:var(--shadow-3);transform:translateY(20px);transition:transform .25s cubic-bezier(.4,0,.2,1);
}
@media(min-width:640px){.modal{border-radius:var(--radius-lg);}}
.modal-scrim.open .modal{transform:translateY(0);}
.modal-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);z-index:2;}
.modal-head h3{font-size:18px;}
.modal-body{padding:20px;}
.modal-foot{position:sticky;bottom:0;background:var(--surface);padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;}
.toast{
  background:var(--text);color:var(--bg);padding:12px 16px;border-radius:13px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-3);display:flex;gap:10px;align-items:center;animation:toastIn .3s cubic-bezier(.4,0,.2,1);width:100%;
}
.toast.good{background:var(--good);color:#fff;}
.toast.bad{background:var(--bad);color:#fff;}
.toast svg{width:18px;height:18px;flex:0 0 auto;}
@keyframes toastIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.accordion{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--surface);}
.accordion > summary{padding:14px 16px;cursor:pointer;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:10px;list-style:none;}
.accordion > summary::-webkit-details-marker{display:none;}
.accordion > summary::after{content:"+";margin-left:auto;font-family:var(--font-mono);color:var(--text-dim);font-size:18px;}
.accordion[open] > summary::after{content:"\2212";}
.accordion .acc-body{padding:0 16px 16px;border-top:1px solid var(--border);padding-top:14px;}

/* charts */
.chart-box{width:100%;overflow:hidden;}
.chart-box svg{width:100%;height:auto;display:block;}
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
.bar-row .lbl{width:110px;font-size:12.5px;font-weight:600;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .track{flex:1;height:22px;background:var(--surface-3);border-radius:7px;overflow:hidden;position:relative;}
.bar-row .track i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--primary),var(--primary-strong));}
.bar-row .num{width:56px;text-align:right;font-size:12.5px;font-weight:700;font-family:var(--font-mono);color:var(--text-dim);flex-shrink:0;}

/* quiz */
.q-opt{
  display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:1px solid var(--border);
  border-radius:12px;margin-bottom:9px;cursor:pointer;transition:border-color .14s,background .14s;background:var(--surface);
}
.q-opt:hover{border-color:var(--border-strong);}
.q-opt.sel{border-color:var(--primary);background:var(--primary-dim);}
.q-opt.correct{border-color:var(--good);background:var(--good-dim);}
.q-opt.wrong{border-color:var(--bad);background:var(--bad-dim);}
.q-opt .letter{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto;font-family:var(--font-mono);}
.q-opt.sel .letter{background:var(--primary);color:var(--primary-ink);}
.q-opt.correct .letter{background:var(--good);color:#fff;}
.q-opt.wrong .letter{background:var(--bad);color:#fff;}

.loader{width:20px;height:20px;border:2.5px solid var(--primary-dim);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.callout{padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.5;border:1px solid var(--border);background:var(--surface-2);display:flex;gap:11px;}
.callout svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;}
.callout.info{background:var(--info-dim);border-color:color-mix(in srgb,var(--info) 26%,transparent);color:var(--text);}
.callout.info svg{color:var(--info);}
.callout.warn{background:var(--warn-dim);border-color:color-mix(in srgb,var(--warn) 28%,transparent);}
.callout.warn svg{color:var(--warn);}
.callout.bad{background:var(--bad-dim);border-color:color-mix(in srgb,var(--bad) 28%,transparent);}
.callout.bad svg{color:var(--bad);}
.callout.good{background:var(--good-dim);border-color:color-mix(in srgb,var(--good) 28%,transparent);}
.callout.good svg{color:var(--good);}

.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.badge-card{padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);text-align:center;transition:transform .14s;}
.badge-card.locked{opacity:0.5;filter:grayscale(0.7);}
.badge-card .ico{width:52px;height:52px;margin:0 auto 10px;border-radius:15px;display:grid;place-items:center;background:var(--primary-dim);color:var(--primary);}
.badge-card .ico svg{width:26px;height:26px;}
.badge-card h4{font-size:13.5px;}
.badge-card p{font-size:11.5px;color:var(--text-dim);margin:5px 0 0;line-height:1.4;}

.xp-ring{--p:0;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p)*1%), var(--surface-3) 0);flex:0 0 auto;}
.xp-ring .inner{width:86px;height:86px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex-direction:column;text-align:center;}
.xp-ring .inner b{font-size:22px;font-family:var(--font-mono);line-height:1;}
.xp-ring .inner span{font-size:10px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--text-dim);}
.kv .v{font-weight:700;text-align:right;}

.fade-in{animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.stagger > *{animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both;}
.stagger > *:nth-child(1){animation-delay:.02s;}
.stagger > *:nth-child(2){animation-delay:.06s;}
.stagger > *:nth-child(3){animation-delay:.10s;}
.stagger > *:nth-child(4){animation-delay:.14s;}
.stagger > *:nth-child(5){animation-delay:.18s;}
.stagger > *:nth-child(6){animation-delay:.22s;}
.stagger > *:nth-child(7){animation-delay:.26s;}
.stagger > *:nth-child(8){animation-delay:.30s;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;}}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:.2;}}

.hide{display:none !important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
@media print{
  .topbar,.sidebar,.scrim,.no-print{display:none!important;}
  main{margin:0;padding:0;max-width:none;}
  body::before{display:none;}
  .card,.list-item,.stat{box-shadow:none;border-color:#ccc;}
}


/* Embedded original apps — inlined into the page (no iframe) */
.inl-host{position:fixed;inset:0;z-index:60;overflow:auto;background:var(--bg);-webkit-overflow-scrolling:touch;}
body.immersive .topbar,
body.immersive .sidebar,
body.immersive .scrim{display:none!important;}
body.immersive main{margin:0!important;padding:0!important;max-width:none!important;}
body.immersive::before{display:none;}
.inl-exit{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:230;
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
  background:var(--surface);color:var(--text);border:1px solid var(--border);cursor:pointer;
  font-weight:700;font-size:13px;box-shadow:var(--shadow-3);}
.inl-exit svg{width:18px;height:18px;flex:0 0 auto;}
.inl-exit{white-space:nowrap;}
.inl-exit:hover{background:var(--surface-2);}
</style>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids){
    if (kid === null || kid === undefined || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
};

const uid = (p="id") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const nowISO = () => new Date().toISOString();
const todayStr = (d=new Date()) => {
  const x = new Date(d);
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
};
const parseDay = (s) => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate()+n); return todayStr(d); };
const daysBetween = (a,b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);
const fmtDate = (s) => {
  if (!s) return "—";
  const d = parseDay(s);
  const locale = LANG === "hi" ? "hi-IN" : "en-IN";
  return d.toLocaleDateString(locale, { day:"numeric", month:"short", year:"numeric" });
};
const fmtDateTime = (iso) => {
  if (!iso) return "—";
  const locale = LANG === "hi" ? "hi-IN" : "en-IN";
  return new Date(iso).toLocaleString(locale, { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
};

function seedSyllabus(db){
  let sIdx = 0;
  STARTER_SYLLABUS.forEach(subj => {
    const sid = uid("subj");
    db.subjects.push({ id:sid, name:subj.name, order:sIdx++, createdAt:nowISO() });
    subj.chapters.forEach((ch, ci) => {
      db.chapters.push({
        id:uid("chap"), subjectId:sid, name:ch, order:ci, hidden:false,
        status:"notStarted", passing:75, verifiedAt:null, lastRevisedAt:null,
        needsRevision:false, createdAt:nowISO()
      });
    });
  });
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) throw new Error("no db");
    const parsed = JSON.parse(raw);
    DB = migrate(parsed);
  }catch(e){
    DB = defaultDB();
    seedSyllabus(DB);
    persist();
  }
  return DB;
}
function migrate(db){
  if (!db.meta) db.meta = { schemaVersion:SCHEMA_VERSION, createdAt:nowISO() };
  const d = defaultDB();
  // shallow-fill any missing top-level keys (forward-compatible)
  for (const k of Object.keys(d)){
    if (db[k] === undefined) db[k] = d[k];
  }
  for (const k of Object.keys(d.settings)){
    if (db.settings[k] === undefined) db.settings[k] = d.settings[k];
  }
  // make sure every provider has a default model (e.g. when a provider is added)
  if (!db.settings.activeModel) db.settings.activeModel = d.settings.activeModel;
  for (const k of Object.keys(d.settings.activeModel)){
    if (db.settings.activeModel[k] === undefined) db.settings.activeModel[k] = d.settings.activeModel[k];
  }
  if (!db.ai || !db.ai.usageDate){ db.ai = { usageDate:todayStr(), used:0, lastStatus:"—" }; }
  const from = Number(db.meta.schemaVersion) || 1;
  if (from < 2) migrateEnglishLiterature(db);
  if (from < 3) migrateHindiSyllabus(db);
  if (from < 4) migrateModelDefaults(db);
  if (from < 5) migrateModelDefaults(db);
  if (from < 6) migrateSanskritSyllabus(db);
  db.meta.schemaVersion = SCHEMA_VERSION;
  return db;
}

/* Generic: swap a subject's placeholder chapters for a real list, but only
   when the placeholders carry no targets or test history — student data is
   never destroyed. Names already present are not duplicated. */
function migrateSubjectChapters(db, subjectName, placeholders, newChapters){
  const subj = (db.subjects||[]).find(s => s.name === subjectName);
  if (!subj) return;
  const ph = (db.chapters||[]).filter(c => c.subjectId === subj.id && placeholders.includes(c.name));
  if (!ph.length) return;
  const linked = (cid) => (db.targets||[]).some(t => t.chapterId === cid) || (db.attempts||[]).some(a => a.chapterId === cid);
  const removable = ph.filter(c => !linked(c.id));
  if (!removable.length) return;
  const removeIds = new Set(removable.map(c => c.id));
  db.chapters = db.chapters.filter(c => !removeIds.has(c.id));
  const kept = db.chapters.filter(c => c.subjectId === subj.id).sort((a,b)=>a.order-b.order);
  const keptNames = new Set(kept.map(c => c.name));
  const added = newChapters.filter(n => !keptNames.has(n)).map((name) => ({
    id:uid("chap"), subjectId:subj.id, name, order:0, hidden:false,
    status:"notStarted", passing:75, verifiedAt:null, lastRevisedAt:null, needsRevision:false, createdAt:nowISO()
  }));
  db.chapters = db.chapters.concat(added);
  added.concat(kept).forEach((c,i)=>{ c.order = i; });
}

/* ============================================================
   Target rollover (idempotent) — runs on app open
   ============================================================ */
function rolloverTargets(){
  const today = todayStr();
  let moved = 0;
  DB.targets.forEach(x => {
    if (x.status === "completed" || x.status === "cancelled") return;
    if (!x.currentDue || x.currentDue >= today) return;
    if (x.lastRolledTo === today) return; // idempotent guard
    const from = x.currentDue;
    x.rescheduleHistory = x.rescheduleHistory || [];
    x.rescheduleHistory.push({ from, to:today, at:nowISO(), auto:true });
    x.rescheduleCount = (x.rescheduleCount||0) + 1;
    x.currentDue = today;
    x.lastRolledTo = today;
    x.status = "rescheduled";
    moved++;
  });
  if (moved){ persist(); }
  return moved;
}

function xpTotal(){ return DB.xpTx.reduce((a,b)=>a+b.amount, 0); }
function levelFromXp(xp){ // 100 XP per level, growing
  let lvl = 1, need = 100, acc = 0;
  while (xp >= acc + need){ acc += need; lvl++; need = Math.round(need * 1.25); }
  return { level:lvl, into:xp - acc, need };
}
function addXp(amount, reason, refId, dedupeKey){
  if (dedupeKey){
    const dup = DB.xpTx.some(x => x.dedupeKey === dedupeKey);
    if (dup) return false; // anti-abuse: no duplicate rewards
  }
  DB.xpTx.push({ id:uid("xp"), amount, reason, refId:refId||null, ts:nowISO(), dedupeKey:dedupeKey||null });
  persist();
  return true;
}
function completedValidDays(){
  // map day -> {valid:bool}
  const byDay = {};
  DB.targets.filter(x => x.status === "completed" && x.completedAt).forEach(x => {
    const day = todayStr(new Date(x.completedAt));
    byDay[day] = byDay[day] || { valid:false };
    let valid = true;
    if (x.requiresTest && x.chapterId){
      const c = getChapter(x.chapterId);
      if (!c || c.status !== "verified") valid = false;
    }
    if (valid) byDay[day].valid = true;
  });
  return byDay;
}
function currentStreak(){
  const byDay = completedValidDays();
  let streak = 0;
  let d = todayStr();
  // allow today to be "not yet" — start from today, if not valid, start from yesterday
  if (!(byDay[d] && byDay[d].valid)) d = addDays(d, -1);
  while (byDay[d] && byDay[d].valid){ streak++; d = addDays(d, -1); }
  return streak;
}

function weakChapters(){
  const out = [];
  DB.chapters.forEach(c => {
    if (c.hidden) return;
    const at = DB.attempts.filter(a => a.chapterId === c.id).sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
    if (c.needsRevision){ out.push({ chapter:c, reason:"flagged", last:at[0] }); return; }
    if (at.length){
      const last = at[0];
      if (last.passed === false){ out.push({ chapter:c, reason:"failed", last }); return; }
      const lowCount = at.slice(0,3).filter(a => a.score < 70).length;
      if (lowCount >= 2){ out.push({ chapter:c, reason:"low", last }); return; }
    }
    if (c.status === "verified" && c.lastRevisedAt){
      const days = daysBetween(todayStr(new Date(c.lastRevisedAt)), todayStr());
      if (days >= 21) out.push({ chapter:c, reason:"stale", last:at[0] });
    }
  });
  return out;
}

function sanitizeDetail(s){
  // never let an API key leak into a message (Gemini puts the key in the URL)
  let out = String(s||"");
  out = out.replace(/([?&](?:key|api[_-]?key|access_token|token)=)[^&\s]+/gi, "$1***");
  out = out.replace(/Bearer\s+[A-Za-z0-9._\-]+/gi, "Bearer ***");
  return out.slice(0, 200);
}
async function fetchWithTimeout(url, opts, timeoutSec){
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), Math.max(5, Number(timeoutSec)||45) * 1000);
  try{
    const r = await fetch(url, { ...opts, signal:ctrl.signal });
    if (!r.ok){
      // surface the provider's own message (e.g. which model was not found)
      let snippet = "";
      try{
        const body = await r.text();
        const m = body.match(/"message"\s*:\s*"([^"]{0,200})"/);
        snippet = sanitizeDetail(m ? m[1] : body).replace(/\s+/g," ").trim();
      }catch(_){}
      const code = (r.status === 401 || r.status === 403) ? "badKey"
        : r.status === 429 ? "rate"
        : (r.status === 400 || r.status === 422) ? "badRequest"
        : r.status === 404 ? "notFound"
        : r.status >= 500 ? "server" : "badResp";
      throw new AIError(code, snippet, r.status);
    }
    return r;
  }catch(e){
    if (e.name === "AbortError") throw new AIError("timeout");
    if (e instanceof AIError) throw e;
    // fetch() itself failed, so the request never reached the provider.
    // Offline -> "network"; otherwise it is a reachability/CORS/endpoint problem.
    throw new AIError(navigator.onLine ? "blocked" : "network", sanitizeDetail(e.message));
  }finally{ clearTimeout(to); }
}
class AIError extends Error{
  constructor(code, detail, httpStatus){ super(code); this.code = code; this.detail = detail || ""; this.httpStatus = httpStatus || 0; }
}
function aiErrorText(err){
  const map = { badKey:"ai.badKey", rate:"ai.rate", timeout:"ai.timeout", badResp:"ai.badResp",
    fewQuestions:"ai.fewQuestions", noKey:"ai.noKey", noInternet:"ai.noInternet", limit:"ai.limit",
    empty:"ai.empty", unsupported:"ai.unsupported", modelMissing:"ai.modelMissing",
    blocked:"ai.blocked", badRequest:"ai.badRequest", notFound:"ai.notFound", server:"ai.server",
    network:"ai.noInternet" };
  let msg = t(map[err.code] || "ai.badResp");
  if (err.httpStatus) msg += " (HTTP " + err.httpStatus + ")";
  if (err.detail) msg += " — " + err.detail;
  return msg;
}

    : "";
  const avoidLine = (avoid && avoid.length)
    ? "\nDo not repeat or paraphrase any of these questions already used: " + avoid.slice(0,25).map(q=>"- "+String(q).slice(0,120)).join(" ")
    : "";
  return `Generate ${count} multiple-choice questions for the RBSE (Rajasthan Board) Class 10 subject "${subject}", chapter "${chapter}".
Difficulty level: ${diff}. ${langLine}${avoidLine}
Return ONLY a JSON object with this exact shape:
{"questions":[{"id":"q1","question":"...","options":["A","B","C","D"],"correctIndex":0,"explanation":"..."}]}
Rules:
- Exactly 4 options per question, exactly one correct answer (correctIndex 0-3).
- Questions must be relevant to the chapter and appropriate for Class 10.
- Concise explanations. No duplicate questions. No ambiguous wording.
- ids must be unique strings.`;
}

/* Be forgiving about where the question array sits in the JSON — models
   variously return {questions:[...]}, a bare array, or {data:[...]}. */
function extractQuestionArray(data){
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") return null;
  for (const k of ["questions","Questions","mcqs","MCQs","quiz","Quiz","items","data","results"]){
    if (Array.isArray(data[k])) return data[k];
  }
  for (const v of Object.values(data)){
    if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" &&
        ("question" in v[0] || "options" in v[0] || "choices" in v[0])) return v;
  }
  return null;
}
function validateQuestions(rawText, minCount, seen){
  let data;
  try{
    let txt = String(rawText).trim();
    // strip code fences if present
    txt = txt.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
    // keep from the first { or [ to the last } or ]
    const starts = [txt.indexOf("{"), txt.indexOf("[")].filter(i => i >= 0);
    const s = starts.length ? Math.min.apply(null, starts) : -1;
    const e = Math.max(txt.lastIndexOf("}"), txt.lastIndexOf("]"));
    if (s >= 0 && e > s) txt = txt.slice(s, e+1);
    data = JSON.parse(txt);
  }catch(e){ throw new AIError("badResp"); }
  const qs = extractQuestionArray(data);
  if (!Array.isArray(qs)) throw new AIError("badResp");
  seen = seen || new Set();
  const clean = [];
  qs.forEach((q, i) => {
    if (!q || typeof q.question !== "string" || !q.question.trim()) return;
    let opts = q.options || q.choices;
    if (!Array.isArray(opts) || opts.length !== 4) return;
    opts = opts.map(o => String(o));
    if (opts.some(o => !o.trim())) return;
    let ci = q.correctIndex;
    if (ci === undefined) ci = q.correct_index;
    if (ci === undefined && q.answer !== undefined){
      const idx = opts.findIndex(o => o === q.answer || o === String.fromCharCode(65 + (q.answer||0)));
      ci = idx;
    }
    ci = Number(ci);
    if (!Number.isInteger(ci) || ci < 0 || ci > 3) return;
    const key = q.question.trim().toLowerCase().replace(/\s+/g," ");
    if (seen.has(key)) return; // dedupe (also against earlier batches)
    seen.add(key);
    clean.push({
      id:"q" + seen.size, question:q.question.trim(), options:opts, correctIndex:ci,
      explanation: String(q.explanation || q.explanation_text || "").trim()
    });
  });
  if (clean.length < (minCount || 1)) throw new AIError("badResp");
  return clean;
}

async function generateQuestions(subject, chapter, count, difficulty){
  if (!navigator.onLine) throw new AIError("noInternet");
  const p = activeProvider();
  const key = providerKey(p);
  if (!key) throw new AIError("noKey");
  const model = activeModel();
  if (!model) throw new AIError("modelMissing");
  const cfg = { key, endpoint:providerEndpoint(p), model, timeout:DB.settings.timeout };
  // question language: a setting, or the current interface language. Asking the
  // model to write in the target language costs nothing extra — no second call.
  const qlang = (DB.settings.questionLang && DB.settings.questionLang !== "app") ? DB.settings.questionLang : LANG;
  const seen = new Set();
  let collected = [];
  let lastErr = null;
  // Up to two requests: the initial one, plus ONE controlled top-up when the
  // model returns fewer valid questions than asked (only if the daily limit
  // permits). Whatever validates is kept — a short test beats no test at all.
  for (let attempt = 0; attempt < 2 && collected.length < count; attempt++){
    if (!usageAvailable()){
      if (collected.length) break;
      throw new AIError("limit");
    }
    const need = count - collected.length;
    let text;
    try{
      text = await PROVIDERS[p].generate(cfg, buildPrompt(subject, chapter, need, difficulty, qlang, collected.map(q=>q.question)));
    }catch(err){
      // count a request only when it actually reached the provider, so a
      // blocked/offline attempt does not burn the daily limit
      if (err.code !== "blocked" && err.code !== "network") recordUsage();
      lastErr = err;
      if (collected.length) break;   // keep what we already have
      throw err;
    }
    recordUsage();
    if (!text || !text.trim()){
      lastErr = new AIError("empty");
      if (collected.length) break;
      throw lastErr;
    }
    try{
      collected = collected.concat(validateQuestions(text, 1, seen));
    }catch(err){
      lastErr = err;
      if (collected.length) break;
      throw err;
    }
  }
  if (!collected.length) throw (lastErr || new AIError("badResp"));
  return collected.slice(0, count);
}

function usageAvailable(){
  const today = todayStr();
  if (DB.ai.usageDate !== today){ DB.ai.usageDate = today; DB.ai.used = 0; persist(); }
  return DB.ai.used < DB.settings.dailyLimit;
}
function recordUsage(){
  const today = todayStr();
  if (DB.ai.usageDate !== today){ DB.ai.usageDate = today; DB.ai.used = 0; }
  DB.ai.used += 1;
  persist();
}
function checkAndCountUsage(){ if (!usageAvailable()) return false; recordUsage(); return true; }

/* ============================================================
   On-device test translation — the browser's built-in Translator API.
   It runs locally on the device: it consumes NO AI tokens and never
   contacts the AI provider. If the browser lacks the API, the app says
   so plainly rather than falling back to an AI call.
   ============================================================ */
const _trCache = {};
function translatorCtor(){
  if (typeof self === "undefined") return null;
  return self.Translator || (self.translation && self.translation.Translator) || null;
}
function trTargetLang(){ return LANG === "hi" ? "hi" : "en"; }
function trSourceLang(){ return trTargetLang() === "hi" ? "en" : "hi"; }
async function getTranslator(from, to, onProgress){
  const Ctor = translatorCtor();
  if (!Ctor) return null;
  const key = from + ">" + to;
  if (_trCache[key]) return _trCache[key];
  const work = (async () => {
    if (typeof Ctor.availability === "function"){
      const a = await Ctor.availability({ sourceLanguage:from, targetLanguage:to });
      if (a === "unavailable") return null;
      if ((a === "downloadable" || a === "downloading") && onProgress) onProgress(0);
    } else if (self.translation && self.translation.canTranslate){
      const a = await self.translation.canTranslate({ sourceLanguage:from, targetLanguage:to });
      if (a === "no") return null;
    }
    const opts = { sourceLanguage:from, targetLanguage:to };
    if (onProgress) opts.monitor = (m) => { try{ m.addEventListener("downloadprogress", e => onProgress(e.loaded)); }catch(_){} };
    const make = (typeof Ctor.create === "function") ? Ctor.create(opts)
      : (self.translation && self.translation.createTranslator) ? self.translation.createTranslator(opts)
      : null;
    if (!make) return null;
    return await make;
  })();
  try{
    // the availability check itself can hang, so the WHOLE flow is time-boxed
    // (45s) — the button can never spin forever
    const tr = await Promise.race([
      work,
      new Promise((_, rej) => setTimeout(() => rej(new Error("tr-timeout")), 45000))
    ]);
    if (tr) _trCache[key] = tr;
    return tr;
  }catch(e){ return null; }
}
async function trText(tr, s){
  if (!tr || !s) return s || "";
  try{ return await tr.translate(String(s)); }catch(e){ return s; }
}
async function trQuestion(tr, q){
  const out = { question: await trText(tr, q.question), options: [], explanation: await trText(tr, q.explanation || "") };
  for (const o of q.options) out.options.push(await trText(tr, o));
  return out;
}

/* ============================================================
   Notifications (browser Notification API — best effort)
   ============================================================ */
async function requestNotifPermission(){
  if (!("Notification" in window)) return "unsupported";
  if (Notification.permission === "granted") return "granted";
  if (Notification.permission === "denied") return "denied";
  try{ return await Notification.requestPermission(); }catch(e){ return "denied"; }
}
function notify(title, body){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try{ new Notification(title, { body, icon:undefined }); }catch(e){}
}
let notifTimers = [];
function scheduleReminders(){
  notifTimers.forEach(clearTimeout); notifTimers = [];
  if (!DB.settings.notifications) return;
  const today = todayStr();
  DB.targets.forEach(x => {
    if (x.status === "completed" || x.status === "cancelled") return;
    const time = x.reminder || DB.settings.defaultReminder;
    if (!time) return;
    const due = x.currentDue || today;
    const when = parseDay(due);
    const [h,m] = time.split(":").map(Number);
    when.setHours(h||19, m||0, 0, 0);
    const ms = when.getTime() - Date.now();
    if (ms > 0 && ms < 2147483647){
      const id = setTimeout(() => notify("Target 100", x.title), ms);
      notifTimers.push(id);
    }
  });
}

/* ============================================================
   Charts — lightweight inline SVG (no external deps, offline-safe)
   ============================================================ */
function barChart(items, opts={}){
  // items: [{label, value, max?}]
  if (!items.length) return emptyChart(opts.height||160);
  const h = opts.height || 170, pad = 26, barW = Math.min(46, Math.max(16, (520 - items.length*8) / items.length));
  const max = Math.max(1, ...items.map(i => i.value));
  const gap = (items.length > 1) ? 14 : 0;
  const w = Math.max(300, items.length * (barW + gap) + pad*2);
  let bars = "";
  items.forEach((it, i) => {
    const bh = Math.round((it.value / max) * (h - 54));
    const x = pad + i * (barW + gap);
    const y = h - 34 - bh;
    const col = it.color || "var(--primary)";
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(bh,2)}" rx="6" fill="${col}"/>`;
    bars += `<text x="${x + barW/2}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="700" font-family="Azeret Mono, monospace" fill="var(--text)">${it.value}</text>`;
    const lbl = String(it.label);
    const short = lbl.length > 10 ? lbl.slice(0,9) + "…" : lbl;
    bars += `<text x="${x + barW/2}" y="${h - 14}" text-anchor="middle" font-size="10.5" fill="var(--text-dim)">${esc(short)}</text>`;
  });
  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${bars}</svg></div>`;
}
function lineChart(points, opts={}){
  // points: [{label, value}]
  if (points.length < 2) return emptyChart(opts.height||160);
  const h = opts.height || 180, padL = 34, padR = 14, padT = 16, padB = 30;
  const w = 560;
  const max = Math.max(100, ...points.map(p => p.value));
  const min = 0;
  const xAt = i => padL + (i/(points.length-1)) * (w - padL - padR);
  const yAt = v => padT + (1 - (v-min)/(max-min)) * (h - padT - padB);
  let path = "", area = "", dots = "", grid = "";
  for (let g = 0; g <= 4; g++){
    const v = min + (max-min)*(g/4), y = yAt(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="var(--text-faint)" font-family="Azeret Mono, monospace">${Math.round(v)}</text>`;
  }
  points.forEach((p, i) => {
    const x = xAt(i), y = yAt(p.value);
    path += (i ? "L" : "M") + x + " " + y + " ";
    dots += `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>`;
    if (i % Math.ceil(points.length/6) === 0 || i === points.length-1)
      dots += `<text x="${x}" y="${h-10}" text-anchor="middle" font-size="9.5" fill="var(--text-dim)">${esc(p.label)}</text>`;
  });
  area = `M ${padL} ${yAt(min)} L ` + points.map((p,i)=>`${xAt(i)} ${yAt(p.value)}`).join(" L ") + ` L ${xAt(points.length-1)} ${yAt(min)} Z`;
  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">
    ${grid}
    <path d="${area}" fill="var(--primary-dim)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg></div>`;
}
function emptyChart(h){
  return `<div class="empty" style="padding:28px 12px;">
    ${svgIcon('<path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-4 4"/>', 1.6)}
    <p>${esc(t("rep.noData"))}</p></div>`;
}
function barRow(label, value, max, color){
  const pct = max ? Math.round((value/max)*100) : 0;
  const n = el("div", { class:"bar-row" });
  n.innerHTML = `<div class="lbl">${esc(label)}</div>
    <div class="track"><i style="width:${pct}%;${color?("background:"+color):""}"></i></div>
    <div class="num">${value}</div>`;
  return n;
}

function parseSyllabusText(text){
  const lines = String(text||"").split(/\r?\n/);
  const groups = []; let cur = null;
  lines.forEach(raw => {
    if (!raw.trim()) return;
    const indent = raw.match(/^\s*/)[0].length;
    const clean = raw.replace(/^[\s•\-\*\d.]+/,"").trim();
    if (!clean) return;
    const isChild = indent > 0 || /^[•\-\*]/.test(raw.trim());
    if (!isChild){ cur = { subject:clean, chapters:[] }; groups.push(cur); }
    else if (cur){ cur.chapters.push(clean); }
    else { cur = { subject:clean, chapters:[] }; groups.push(cur); }
  });
  return groups.filter(g => g.subject);
}

  [["open","tgt.pending"],["today","common.today"],["all","common.all"],["completed","tgt.completed"]].forEach(([k,lbl])=>{

  view.appendChild(head(t("tgt.title"), t("tgt.sub"), actions));

  // A completed task appears ONLY under Completed — it is hidden from Open,
  // Today and All, so finishing something removes it from the working lists.
  let list = DB.targets.slice().sort((a,b)=>(a.currentDue||"").localeCompare(b.currentDue||""));
  if (screenState.tgtFilter==="open") list = list.filter(x=>x.status!=="completed"&&x.status!=="cancelled");

function markTargetCompleted(x){
  if (x.status === "completed") return;
  x.status = "completed";
  x.completedAt = nowISO();
  if (x.chapterId){
    const c = getChapter(x.chapterId);
    if (x.type === "revision"){
      const sess = DB.revisionSessions.find(r => !r.done && r.chapterId === x.chapterId);
      if (sess){ sess.done = true; sess.doneAt = nowISO(); }
      addXp(15, "revision", x.id, "rev_" + x.id);
      if (c){ c.lastRevisedAt = nowISO(); c.needsRevision = false; }
    } else {
      // chapter-linked study target: records study activity ONLY, never verifies
      if (c && c.status !== "verified"){ c.status = c.status==="notStarted" ? "inProgress" : c.status; }
      addXp(20, "target", x.id, "tgt_" + x.id);
    }
  } else {
    addXp(20, "target", x.id, "tgt_" + x.id);
  }
  persist();
  checkAchievements();
}
/* Completion is test-gated: a chapter-linked task can only be completed by
   passing its chapter test. Independent (no-chapter) tasks are completed
   directly, since there is no chapter to verify. */
function completeLabel(x){
  const c = x.chapterId ? getChapter(x.chapterId) : null;

function requestComplete(x){

    markTargetCompleted(x); render(); toast(t("tgt.markComplete") + " · +XP", "good"); return;

  const c = getChapter(x.chapterId);
  if (c && c.status === "verified"){
    markTargetCompleted(x); render(); toast(t("tgt.alreadyVerified") + " · +XP", "good"); return;
  }
  startTargetTest(x);
}

async function startGeneration(subjectId, chapterId, count, difficulty, passing, btn, completeTargetId){
  const subj = subjectName(subjectId), chap = chapterName(chapterId);
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="loader"></span><span>'+esc(t("test.generating"))+"</span>"; }
  try{
    const qs = await generateQuestions(subj, chap, count, difficulty);
    DB.ai.lastStatus = "ok"; persist();
    // set chapter passing
    const c = getChapter(chapterId); if (c){ c.passing = passing; persist(); }
    testState = {
      phase:"taking", subjectId, chapterId, count: qs.length, difficulty, passing, completeTargetId: completeTargetId || null,
      questions:qs, answers:new Array(qs.length).fill(null), idx:0, startedAt:nowISO()
    };
    saveActiveTest();
    if (qs.length < count) toast(qs.length + " " + t("common.of") + " " + count + " " + t("test.questionsGenerated"), "");
    render();
  }catch(err){
    DB.ai.lastStatus = "error: " + (err.code||"?"); persist();
    toast(aiErrorText(err), "bad");
    if (btn){ btn.disabled = false; btn.innerHTML = svgIcon('<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>')+"<span>"+esc(t("test.generate"))+"</span>"; }
    // give the student a no-token way forward: run the prompt in any AI, paste the JSON
    openAiJsonHelper({ subjectId, chapterId, count, difficulty, passing, completeTargetId, errorText: aiErrorText(err) });
  }
}

/* Score over the questions the student has NOT marked out of syllabus. */
function scoreIncluded(questions, answers){
  const included = questions.map((q,i)=>i).filter(i => !questions[i].outOfSyllabus);
  let correct = 0;
  included.forEach(i => { if (answers[i] === questions[i].correctIndex) correct++; });
  const scoredTotal = included.length;
  const score = scoredTotal ? Math.round((correct/scoredTotal)*100) : 0;
  return { included, correct, scoredTotal, score };
}
/* Apply an attempt's outcome to its chapter (and linked task), idempotently:
   XP is dedupe-keyed, and an already-verified chapter is never un-verified. */
function applyAttemptOutcome(a){
  const c = getChapter(a.chapterId);
  if (c){
    if (a.passed){
      c.status = "verified"; if (!c.verifiedAt) c.verifiedAt = nowISO(); c.needsRevision = false;
      addXp(50, "test_pass", a.id, "pass_" + a.id);
      const sess = DB.revisionSessions.find(r=>!r.done && r.chapterId===c.id);
      if (sess){ sess.done = true; sess.doneAt = nowISO(); }
      if (a.completeTargetId){
        const tgt = DB.targets.find(t => t.id === a.completeTargetId);
        if (tgt && tgt.status !== "completed") markTargetCompleted(tgt);
      }
      checkAchievements();
      celebrate();
    } else {
      c.needsRevision = true;
      if (c.status !== "verified") c.status = "needsRevision";
    }
  }
  persist();
}
/* Recompute an attempt after a question is marked/unmarked out of syllabus. */
function recomputeAttempt(a){
  const r = scoreIncluded(a.questions, a.answers);
  if (!r.scoredTotal) return false;
  a.correct = r.correct; a.total = r.scoredTotal; a.score = r.score;
  a.generated = a.questions.length;
  a.excluded = a.questions.length - r.scoredTotal;
  a.passed = a.score >= a.passing;
  applyAttemptOutcome(a);
  return true;
}
function toggleOutOfSyllabus(a, idx){
  const q = a.questions[idx];
  const was = !!q.outOfSyllabus;
  q.outOfSyllabus = !was;
  if (!recomputeAttempt(a)){ q.outOfSyllabus = was; toast(t("test.allExcluded"),"bad"); return; }
  render();
}
function submitTest(){
  const ts = testState;
  const unanswered = ts.answers.filter(a=>a===null).length;
  const doSubmit = () => {
    const r = scoreIncluded(ts.questions, ts.answers);
    if (!r.scoredTotal){ toast(t("test.allExcluded"),"bad"); return; }
    const attempt = {
      id:uid("att"), chapterId:ts.chapterId, subjectId:ts.subjectId,
      startedAt:ts.startedAt, submittedAt:nowISO(),
      score:r.score, correct:r.correct, total:r.scoredTotal,
      generated:ts.questions.length, excluded:ts.questions.length - r.scoredTotal,
      passing:ts.passing, passed:r.score >= ts.passing, difficulty:ts.difficulty, count:ts.questions.length,
      questions:ts.questions, answers:ts.answers, completeTargetId: ts.completeTargetId || null
    };
    DB.attempts.push(attempt);
    applyAttemptOutcome(attempt);
    testState.phase = "results"; testState.attemptId = attempt.id;
    saveActiveTest();
    render();
    if (ts.completeTargetId) toast(attempt.passed ? t("tgt.completedViaTest") : t("tgt.notCompletedFail"), attempt.passed ? "good" : "bad");
  };
  if (unanswered > 0){
    confirmDialog(t("test.submitConfirm") + " (" + unanswered + " " + t("test.unanswered") + ")", doSubmit, t("test.submitTest"));
  } else {
    confirmDialog(t("test.submitConfirm"), doSubmit, t("test.submitTest"));
  }
}

/* ============================================================
   Backup / restore
   ============================================================ */
function exportBackup(){
  const clone = JSON.parse(JSON.stringify(DB));
  delete clone.secrets; // never export keys
  clone._exportedAt = nowISO();
  clone._app = "Target100-web";
  // The two inlined apps keep their own storage keys. Read them and put them
  // into the export as REAL JSON objects (not escaped strings), so the file is
  // readable and round-trips cleanly.
  try{
    const emb = {};
    const addEmb = (name, key) => {
      try{ const raw = localStorage.getItem(key); if (raw) emb[name] = JSON.parse(raw); }
      catch(e){ /* skip a corrupt entry rather than fail the whole export */ }
    };
    addEmb("boardRecall", "boardRecall.v2");
    addEmb("forest", "forest.clone.v2");
    if (Object.keys(emb).length) clone._embedded = emb;
  }catch(e){}
  const blob = new Blob([JSON.stringify(clone, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a",{href:url, download:"target100-backup-"+todayStr()+".json"});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(t("set.backup")+" ✓", "good");
}
function importBackup(){
  const inp = el("input",{type:"file", accept:".json"});
  inp.addEventListener("change", ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let data;
      try{ data = JSON.parse(rd.result); }catch(e){ toast(t("ai.badResp"),"bad"); return; }
      if (!data || !Array.isArray(data.subjects) || !Array.isArray(data.targets)){ toast("Not a valid Target 100 backup.", "bad"); return; }
      confirmDialog(t("set.restore") + "? This will replace your current data.", ()=>{
        const secrets = DB.secrets; // preserve keys, which backups exclude
        // restore the inlined apps' data too — accept either real JSON objects
        // (new backups) or the old escaped-string form
        try{
          const emb = data._embedded;
          if (emb){
            const put = (key, val) => {
              if (val === undefined || val === null || val === "") return;
              localStorage.setItem(key, typeof val === "string" ? val : JSON.stringify(val));
            };
            put("boardRecall.v2", emb.boardRecall);
            put("forest.clone.v2", emb.forest);
          }
        }catch(e){}
        DB = migrate(data);
        DB.secrets = secrets;
        persist(); location.reload();
      }, t("set.restore"));
    };
    rd.readAsText(f);
  });
  inp.click();
}

  render();
  scheduleReminders();
  checkAchievements();

  window.addEventListener("offline", updateNet);

}

const _inlineApps = {};
function b64ToText(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function inlineApp(key){
  if (_inlineApps[key]) return _inlineApps[key];
  const style = document.createElement("style");
  style.textContent = b64ToText(INLINE_B64[key].css);
  style.disabled = true;                 // switched on only while the app is open
  document.head.appendChild(style);
  const host = document.createElement("div");
  host.id = "inl-" + key;
  host.className = "inl-host";
  host.style.display = "none";
  host.innerHTML = b64ToText(INLINE_B64[key].body);
  document.body.appendChild(host);
  const sc = document.createElement("script");   // runs once, after its markup exists
  sc.textContent = b64ToText(INLINE_B64[key].js);
  document.body.appendChild(sc);
  _inlineApps[key] = { style, host };
  return _inlineApps[key];
}
function showInline(key, on){
  const rec = _inlineApps[key] || (on ? inlineApp(key) : null);
  if (!rec) return;
  rec.host.style.display = on ? "" : "none";
  rec.style.disabled = !on;
}
function hideOtherInline(active){
  Object.keys(_inlineApps).forEach(k => { if (k !== active) showInline(k, false); });
}
function inlineScreen(key, view){
  showInline(key, true);
  hideOtherInline(key);
  // the pill lives inside the app's own host, so it paints above the app
  // (main#view becomes a stacking context, which would put it behind)
  const host = _inlineApps[key].host;
  if (!host.querySelector(".inl-exit")){
    host.appendChild(el("button",{class:"inl-exit",
      html: svgIcon('<path d="M19 12H5M12 19l-7-7 7-7"/>')+"<span>"+esc(t("embed.back"))+"</span>",
      onclick:()=>navigate("dashboard")}));
  }
}
function screenRecall(view){ inlineScreen("recall", view); }
function screenFocus(view){ inlineScreen("focus", view); }
document.addEventListener("DOMContentLoaded", init);
</script>
