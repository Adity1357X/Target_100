function jsonFilePicker(cb){
  const inp = el("input",{type:"file", accept:".json,application/json,text/plain"});
  inp.addEventListener("change", ()=>{
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onerror = ()=>toast(t("toast.notPossible"), "bad");
    fr.onload = ()=>{
      const txt = String(fr.result || "");
      try{ JSON.parse(txt.replace(/^\uFEFF/, "")); }
      catch(e){ toast(t("ai.badResp"), "bad"); return; }
      cb(txt); toast(t("common.loaded"), "good");
    };
    fr.readAsText(f);
  });
  inp.click();
}

/* Score over the questions the student has NOT marked out of syllabus. */
function scoreIncluded(questions, answers){
  const included = questions.map((q,i)=>i).filter(i => !questions[i].outOfSyllabus);
  let correct = 0, earned = 0, maxMarks = 0;
  included.forEach(i => {
    const q = questions[i];
    if (q.type === "short"){
      const m = q.marks || 2;
      const got = Math.max(0, Math.min(m, Number(q.awarded) || 0));
      maxMarks += m; earned += got;
      if (got >= m) correct++;               // a fully-marked answer counts as correct
    } else {
      maxMarks += 1;
      if (answers[i] === q.correctIndex){ earned += 1; correct++; }
    }
  });
  const scoredTotal = maxMarks;
  const score = scoredTotal ? Math.round((earned/scoredTotal)*100) : 0;
  return { included, correct, scoredTotal, score, earned };
}
/* Apply an attempt's outcome to its chapter (and linked task), idempotently:
   XP is dedupe-keyed, and an already-verified chapter is never un-verified. */
function applyAttemptOutcome(a){
  const c = getChapter(a.chapterId);
  if (c){
    if (a.passed){
      c.status = "verified"; if (!c.verifiedAt) c.verifiedAt = nowISO(); c.needsRevision = false;
      addXp(50, "test_pass", a.id, "pass_" + a.id);
      const sess = DB.revisionSessions.find(r=>!r.done && r.chapterId===c.id);
      if (sess){ sess.done = true; sess.doneAt = nowISO(); }
      if (a.completeTargetId){
        const tgt = DB.targets.find(t => t.id === a.completeTargetId);
        if (tgt && tgt.status !== "completed") markTargetCompleted(tgt);
      }
      checkAchievements();
      celebrate();
    } else {
      c.needsRevision = true;
      if (c.status !== "verified") c.status = "needsRevision";
    }
  }
  persist();
}
/* Recompute an attempt after a question is marked/unmarked out of syllabus. */
function recomputeAttempt(a){
  const r = scoreIncluded(a.questions, a.answers);
  if (!r.scoredTotal) return false;
  a.correct = r.correct; a.total = r.scoredTotal; a.score = r.score;
  a.generated = a.questions.length;
  a.excluded = a.questions.length - r.scoredTotal;
  a.passed = a.score >= a.passing;
  applyAttemptOutcome(a);
  return true;
}
function toggleOutOfSyllabus(a, idx){
  const q = a.questions[idx];
  const was = !!q.outOfSyllabus;
  q.outOfSyllabus = !was;
  if (!recomputeAttempt(a)){ q.outOfSyllabus = was; toast(t("test.allExcluded"),"bad"); return; }
  render();
}
async function markShortAnswers(ts){
  const p = activeProvider();
  const key = providerKey(p); if (!key) throw new AIError("noKey");
  const model = activeModel(); if (!model) throw new AIError("modelMissing");
  if (!usageAvailable()) throw new AIError("limit");
  const idxs = ts.questions.map((q, i) => q.type === "short" ? i : -1).filter(i => i >= 0);
  const subject = subjectName(ts.subjectId), chapter = chapterName(ts.chapterId);
  const payload = { subject, chapter,
    answers: idxs.map(i => ({ id: ts.questions[i].id, question: ts.questions[i].question,
                              marks: ts.questions[i].marks || 2, answer: String(ts.answers[i] || "") })) };
  const text = await PROVIDERS[p].generate({ key, endpoint:providerEndpoint(p), model, timeout:DB.settings.timeout },
    shortGradePrompt(subject, chapter, payload, shortLang(subject)));
  recordUsage();
  let data; try{ data = shortParse(text); }catch(e){ throw new AIError("badResp"); }
  const arr = Array.isArray(data) ? data : (data && (data.results || data.items));
  if (!Array.isArray(arr)) throw new AIError("badResp");
  const byId = {}; arr.forEach(r => { if (r && r.id) byId[String(r.id)] = r; });
  idxs.forEach(i => {
    const q = ts.questions[i], r = byId[q.id] || {};
    q.awarded = Math.max(0, Math.min(q.marks || 2, Number(r.score) || 0));
    q.modelAnswer = String(r.modelAnswer || "");
    q.feedback = String(r.feedback || "");
  });
}
function submitTest(){
  const ts = testState;
  const unanswered = ts.answers.filter(a=>a===null || a==="").length;
  const doSubmit = () => {
    const r = scoreIncluded(ts.questions, ts.answers);
    if (!r.scoredTotal){ toast(t("test.allExcluded"),"bad"); return; }
    const attempt = {
      id:uid("att"), chapterId:ts.chapterId, subjectId:ts.subjectId,
      startedAt:ts.startedAt, submittedAt:nowISO(),
      score:r.score, correct:r.correct, total:r.scoredTotal,
      generated:ts.questions.length, excluded:ts.questions.filter(q=>q.outOfSyllabus).length,
      passing:ts.passing, passed:r.score >= ts.passing, difficulty:ts.difficulty, count:ts.questions.length,
      questions:ts.questions, answers:ts.answers, completeTargetId: ts.completeTargetId || null
    };
    DB.attempts.push(attempt);
    applyAttemptOutcome(attempt);
    testState.phase = "results"; testState.attemptId = attempt.id;
    saveActiveTest();
    render();
    if (ts.completeTargetId) toast(attempt.passed ? t("tgt.completedViaTest") : t("tgt.notCompletedFail"), attempt.passed ? "good" : "bad");
  };
  const ask = () => {
    if (unanswered > 0){
      confirmDialog(t("test.submitConfirm") + " (" + unanswered + " " + t("test.unanswered") + ")", doSubmit, t("test.submitTest"));
    } else {
      confirmDialog(t("test.submitConfirm"), doSubmit, t("test.submitTest"));
    }
  };
  const hasShorts = (ts.questions || []).some(q => q.type === "short");
  if (hasShorts && !ts.shortsMarked){
    toast(t("test.marking"), "");
    markShortAnswers(ts)
      .then(()=>{ ts.shortsMarked = true; saveActiveTest(); ask(); })
      .catch(e=>toast(aiErrorText(e), "bad"));
    return;
  }
  ask();
}

const SHORT_KEY = "target100.shortTest";
let shortState = null;
function loadShort(){ try{ return JSON.parse(localStorage.getItem(SHORT_KEY) || "null"); }catch(e){ return null; } }
function saveShort(){ try{ localStorage.setItem(SHORT_KEY, JSON.stringify(shortState)); }catch(e){} }
function clearShort(){ shortState = null; try{ localStorage.removeItem(SHORT_KEY); }catch(e){} }

function shortLang(subject){
  return subjectLangFor(subject, (DB.settings.questionLang && DB.settings.questionLang !== "app") ? DB.settings.questionLang : LANG);
}
function shortLangLine(lang, what){
  if (lang === "hi") return "Write " + what + " in Hindi (Devanagari script).";
  if (lang === "sa") return "Write " + what + " in Sanskrit (Devanagari script).";
  return "Write " + what + " in English.";
}
function shortQuestionsPrompt(subject, chapter, count, difficulty){
  return 'Write ' + count + ' SHORT-ANSWER questions for the RBSE (Rajasthan Board) Class 10 subject "' + subject + '", chapter "' + chapter + '".\n'
    + 'Difficulty: ' + difficulty + '. Each question must be answerable in 2-4 sentences and must test one specific idea from the chapter — a definition, reason, difference, formula, reaction or example.\n'
    + 'Give each question "marks": 1, 2 or 3 depending on how much it asks for.\n'
    + shortLangLine(shortLang(subject), "every question") + '\n'
    + 'No numbering, no answers, no duplicates. Return ONLY a JSON object: {"questions":[{"id":"q1","question":"...","marks":2}]}';
}
function shortGradePrompt(subject, chapter, payload, lang){
  return 'You are an RBSE (Rajasthan Board) Class 10 examiner marking a short-answer test.\n'
    + 'Subject: "' + subject + '"    Chapter: "' + chapter + '"\n'
    + 'The questions, their marks and the student\'s answers are in this JSON:\n' + JSON.stringify(payload) + '\n\n'
    + 'For EVERY question give: "score" out of that question\'s marks (0 to marks, halves allowed), a short "verdict", the "modelAnswer" a topper would write (25-60 words, exam-ready), and one line of "feedback" saying exactly what was missing or wrong.\n'
    + shortLangLine(lang, "the model answers and the feedback") + '\n'
    + 'Return ONLY a JSON object: {"results":[{"id":"q1","score":1.5,"verdict":"Partly correct","modelAnswer":"...","feedback":"..."}],"overall":"two lines on strengths and what to revise"}';
}
function shortParse(text){
  let t = String(text || "").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const starts = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
  const s0 = starts.length ? Math.min.apply(null, starts) : -1;
  const e0 = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (s0 >= 0 && e0 > s0) t = t.slice(s0, e0 + 1);
  return JSON.parse(t);
}
async function shortGenerate(){
  const p = activeProvider();
  const key = providerKey(p); if (!key) throw new AIError("noKey");
  const model = activeModel(); if (!model) throw new AIError("modelMissing");
  if (!usageAvailable()) throw new AIError("limit");
  const subject = subjectName(shortState.subjectId), chapter = chapterName(shortState.chapterId);
  const text = await PROVIDERS[p].generate({ key, endpoint:providerEndpoint(p), model, timeout:DB.settings.timeout },
    shortQuestionsPrompt(subject, chapter, shortState.count, shortState.difficulty));
  recordUsage();
  let data; try{ data = shortParse(text); }catch(e){ throw new AIError("badResp"); }
  applyQuestions(data);
}
function applyQuestions(data){
  const arr = Array.isArray(data) ? data : (data && (data.questions || data.Questions || data.items || data.data));
  if (!Array.isArray(arr) || !arr.length) throw new AIError("badResp");
  const qs = [];
  arr.forEach((q, i) => {
    const text2 = String((q && (q.question || q.q || q.text)) || "").trim();
    if (!text2) return;
    qs.push({ id: String((q && q.id) || ("q" + (i + 1))), question: text2.slice(0, 600),
              marks: Math.max(1, Math.min(5, Number(q && q.marks) || 2)), answer: "" });
  });
  if (!qs.length) throw new AIError("badResp");
  shortState.questions = qs.slice(0, shortState.count);
  shortState.results = null;
  shortState.phase = "taking";
  saveShort();
}
function shortPayload(){
  return {
    subject: subjectName(shortState.subjectId),
    chapter: chapterName(shortState.chapterId),
    answers: (shortState.questions || []).map(q => ({ id:q.id, question:q.question, marks:q.marks, answer:(q.answer || "").trim() }))
  };
}
async function shortGrade(){
  const p = activeProvider();
  const key = providerKey(p); if (!key) throw new AIError("noKey");
  const model = activeModel(); if (!model) throw new AIError("modelMissing");
  if (!usageAvailable()) throw new AIError("limit");
  const subject = subjectName(shortState.subjectId), chapter = chapterName(shortState.chapterId);
  const payload = shortPayload();
  shortState.payload = payload;
  const text = await PROVIDERS[p].generate({ key, endpoint:providerEndpoint(p), model, timeout:DB.settings.timeout },
    shortGradePrompt(subject, chapter, payload, shortLang(subject)));
  recordUsage();
  let data; try{ data = shortParse(text); }catch(e){ throw new AIError("badResp"); }
  applyMarks(data);
}
function applyMarks(data){
  const arr = Array.isArray(data) ? data : (data && (data.results || data.Results || data.items));
  if (!Array.isArray(arr)) throw new AIError("badResp");
  const byId = {};
  arr.forEach(r => { if (r && r.id) byId[String(r.id)] = r; });
  shortState.results = {
    items: (shortState.questions || []).map(q => {
      const r = byId[q.id] || {};
      return { id:q.id,
               score: Math.max(0, Math.min(q.marks, Number(r.score) || 0)),
               verdict: String(r.verdict || ""),
               modelAnswer: String(r.modelAnswer || r.answer || ""),
               feedback: String(r.feedback || "") };
    }),
    overall: String((data && data.overall) || "")
  };
  shortState.phase = "results";
  shortState.finishedAt = nowISO();
  saveShort();
}
function shortTotals(){
  const qs = shortState.questions || [], rs = (shortState.results && shortState.results.items) || [];
  const max = qs.reduce((a, q) => a + q.marks, 0);
  const got = rs.reduce((a, r) => a + (Number(r.score) || 0), 0);
  return { got, max, pct: max ? Math.round(got / max * 100) : 0 };
}

    promptTa.value = promptText;
    body.appendChild(el("label",{class:"field", style:"margin-top:12px;"}, el("span",{text:t("short.promptLabel")}), promptTa,
      el("button",{class:"btn sm", style:"margin-top:8px;", html: svgIcon(copyIco)+"<span>"+esc(t("test.copyPrompt"))+"</span>", onclick:async ()=>{
        try{ await navigator.clipboard.writeText(promptText); toast(t("test.copied"),"good"); }
        catch(e){ try{ promptTa.focus(); promptTa.select(); document.execCommand("copy"); toast(t("test.copied"),"good"); }catch(_){ toast(t("toast.notPossible"),"bad"); } }
      }})));
    const jsonTa = el("textarea",{
      placeholder: isQ ? '{"questions":[{"id":"q1","question":"...","marks":2}]}'
                       : '{"results":[{"id":"q1","score":1.5,"verdict":"...","modelAnswer":"...","feedback":"..."}],"overall":"..."}',
      style:"min-height:130px;font-family:var(--font-mono);font-size:12.5px;"});
    body.appendChild(el("label",{class:"field", style:"margin-top:14px;"}, el("span",{text:t("short.pasteJson")}), jsonTa));
    body.appendChild(el("button",{class:"btn sm", style:"margin-top:8px;", text:t("common.loadJson"),

    const foot = el("div",{class:"modal-foot"});
    foot.appendChild(el("button",{class:"btn", text:t("common.cancel"), onclick:close}));
    foot.appendChild(el("button",{class:"btn", text:t("test.openSettings"), onclick:()=>{ close(); navigate("settings"); }}));
    foot.appendChild(el("button",{class:"btn primary", text: isQ ? t("short.startQ") : t("short.startM"), onclick:()=>{
      try{
        const data = shortParse(jsonTa.value);
        if (isQ) applyQuestions(data); else applyMarks(data);
        close(); render();
      }catch(e){ toast(aiErrorText(new AIError("badResp")), "bad"); }
    }}));
    return el("div",{}, el("div",{class:"modal-head"}, el("h3",{text: isQ ? t("short.jsonTitleQ") : t("short.jsonTitleM")})), body, foot);
  });
}
function downloadJson(name, obj){
  try{
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = el("a",{href:url, download:name});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(t("short.saved"), "good");
  }catch(e){ toast(t("toast.notPossible"), "bad"); }
}
function shortQuestionsPayload(){
  return {
    subject: subjectName(shortState.subjectId),
    chapter: chapterName(shortState.chapterId),
    count: (shortState.questions || []).length,
    questions: (shortState.questions || []).map(q => ({ id:q.id, question:q.question, marks:q.marks }))
  };
}
function shortResultsPayload(){
  const tt = shortTotals();
  return {
    subject: subjectName(shortState.subjectId),
    chapter: chapterName(shortState.chapterId),
    finishedAt: shortState.finishedAt || nowISO(),
    total: tt.got, max: tt.max, percent: tt.pct,
    overall: (shortState.results && shortState.results.overall) || "",
    questions: (shortState.questions || []).map((q, i) => {
      const r = (shortState.results && shortState.results.items[i]) || {};
      return { id:q.id, question:q.question, marks:q.marks, answer:(q.answer || ""),
               score:r.score, verdict:r.verdict || "", modelAnswer:r.modelAnswer || "", feedback:r.feedback || "" };
    })
  };
}

/* ============================================================
   Backup / restore
   ============================================================ */
function isBackup(d){ return !!(d && Array.isArray(d.subjects) && Array.isArray(d.targets)); }
function applyBackupData(data){
  const secrets = DB.secrets;   // API keys and the Firebase config are never inside a backup
  try{
    const emb = data._embedded;
    if (emb){
      const put = (key, val) => {
        if (val === undefined || val === null || val === "") return;
        localStorage.setItem(key, typeof val === "string" ? val : JSON.stringify(val));
      };
      put("boardRecall.v2", emb.boardRecall);
      put("forest.clone.v2", emb.focus || emb.forest);   // focus data, or the older "forest" name
    }
  }catch(e){}
  try{
    if (data._activeTest) localStorage.setItem(ACTIVE_TEST_KEY, JSON.stringify(data._activeTest));
  }catch(e){}
  try{
    if (data._customFont) localStorage.setItem(FONT_KEY, JSON.stringify(data._customFont));
  }catch(e){}
  DB = migrate(data);
  DB.secrets = secrets;
  persist();
}
/* Everything this app keeps on the device: the planner, both embedded apps'
   data, and a test that is still in progress. API keys / the Firebase config
   are deliberately left out. */
function collectAllData(){
  const clone = JSON.parse(JSON.stringify(DB));
  delete clone.secrets;
  clone._exportedAt = nowISO();
  clone._app = "Target100-web";
  clone._format = 2;
  try{
    const emb = {};
    const add = (n,k) => { try{ const r = localStorage.getItem(k); if (r) emb[n] = JSON.parse(r); }catch(e){} };
    add("boardRecall", "boardRecall.v2");
    add("focus", "forest.clone.v2");          // the Focus timer's own data
    add("forest", "forest.clone.v2");         // kept so older backups still read it
    if (Object.keys(emb).length) clone._embedded = emb;
  }catch(e){}
  try{
    const at = localStorage.getItem(ACTIVE_TEST_KEY);
    if (at) clone._activeTest = JSON.parse(at);
  }catch(e){}
  try{
    const ft = localStorage.getItem(FONT_KEY);
    if (ft) clone._customFont = JSON.parse(ft);
  }catch(e){}
  return clone;
}
function exportBackup(){
  const clone = collectAllData();
  const blob = new Blob([JSON.stringify(clone, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a",{href:url, download:"target100-backup-"+todayStr()+".json"});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(t("set.backup")+" ✓", "good");
}
function importBackup(){
  const inp = el("input",{type:"file", accept:".json"});
  inp.addEventListener("change", ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let data;
      try{ data = JSON.parse(rd.result); }catch(e){ toast(t("ai.badResp"),"bad"); return; }
      if (!isBackup(data)){ toast("Not a valid Target 100 backup.", "bad"); return; }
      confirmDialog(t("set.restore") + "? This will replace your current data.", ()=>{
        applyBackupData(data); location.reload();
      }, t("set.restore"));
    };
    rd.readAsText(f);
  });
  inp.click();
}

function celebrate(){
  const host = $("#confetti");

  for (let i=0;i<44;i++){
    const p = el("i",{style:`left:${Math.random()*100}%;top:-20px;background:${colors[i%colors.length]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*0.4}s;`});
    host.appendChild(p);
    setTimeout(()=>p.remove(), 3600);
  }
}

/* ============================================================
   Theme / language application
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", DB.settings.theme || "light");
  document.documentElement.setAttribute("data-accent", DB.settings.accent || "teal");
}
function setLang(l){
  DB.settings.lang = l; LANG = l; persist();
  document.documentElement.lang = l === "hi" ? "hi" : "en";
  $("#brandSub").textContent = t("brand.sub");
  updateLangToggle();
  render();
}
function updateLangToggle(){
  $$("#langToggle button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
}

/* ============================================================
   Init
   ============================================================ */
function updateNet(){
  const online = navigator.onLine;
  const pill = $("#offlinePill");
  pill.classList.toggle("offline", !online);
  $("#netLabel").textContent = online ? t("net.online") : t("net.offline");
}
function init(){
  _baseFontBody = getComputedStyle(document.documentElement).getPropertyValue("--font-body").trim() || "system-ui, sans-serif";
  loadDB();
  applyCustomFont();
  LANG = DB.settings.lang || "en";
  applyTheme();
  document.documentElement.lang = LANG === "hi" ? "hi" : "en";
  $("#brandSub").textContent = t("brand.sub");
  updateLangToggle();
  updateNet();

  // rollover missed targets on open
  const moved = rolloverTargets();
  if (moved) setTimeout(()=>toast(moved + " " + t("tgt.overdue") + " → " + t("tgt.rescheduled"), ""), 700);

  buildNav();
  render();
  scheduleReminders();
  checkAchievements();
  setTimeout(()=>{ fbArmed = true; }, 2500);   // auto-upload starts only after load settles

  // events
  $("#hamburger").addEventListener("click", ()=>document.body.classList.toggle("nav-open"));
  $("#scrim").addEventListener("click", ()=>document.body.classList.remove("nav-open"));
  $("#themeBtn").addEventListener("click", ()=>{ DB.settings.theme = DB.settings.theme==="dark"?"light":"dark"; applyTheme(); persist(); render(); });
  $$("#langToggle button").forEach(b => b.addEventListener("click", ()=>setLang(b.dataset.lang)));
  window.addEventListener("online", updateNet);
  window.addEventListener("offline", updateNet);
  window.addEventListener("keydown", (e)=>{ if (e.key==="Escape"){ document.body.classList.remove("nav-open"); $("#modalScrim").classList.remove("open"); } });
}

const _inlineApps = {};
function b64ToText(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function inlineApp(key){
  if (_inlineApps[key]) return _inlineApps[key];
  const style = document.createElement("style");
  style.textContent = b64ToText(INLINE_B64[key].css);
  style.disabled = true;                 // switched on only while the app is open
  document.head.appendChild(style);
  const host = document.createElement("div");
  host.id = "inl-" + key;
  host.className = "inl-host";
  host.style.display = "none";
  host.innerHTML = b64ToText(INLINE_B64[key].body);
  if (key === "recall" && !window.__T100_SYLLABUS) window.__T100_SYLLABUS = syllabusMap();
  document.body.appendChild(host);
  const sc = document.createElement("script");   // runs once, after its markup exists
  sc.textContent = b64ToText(INLINE_B64[key].js);
  document.body.appendChild(sc);
  _inlineApps[key] = { style, host };
  return _inlineApps[key];
}
function showInline(key, on){
  const rec = _inlineApps[key] || (on ? inlineApp(key) : null);
  if (!rec) return;
  rec.host.style.display = on ? "" : "none";
  rec.style.disabled = !on;
}
function hideOtherInline(active){
  Object.keys(_inlineApps).forEach(k => { if (k !== active) showInline(k, false); });
}
function syllabusMap(){
  const out = {};
  (DB.subjects || []).forEach(s => { out[s.name] = chaptersOf(s.id).filter(c => !c.hidden).map(c => c.name); });
  return out;
}
function inlineScreen(key, view){
  if (key === "recall") window.__T100_SYLLABUS = syllabusMap();
  showInline(key, true);
  hideOtherInline(key);
  if (key === "recall" && typeof window.__boardRecallSync === "function") window.__boardRecallSync();
  // the pill lives inside the app's own host, so it paints above the app
  // (main#view becomes a stacking context, which would put it behind)
  const host = _inlineApps[key].host;
  if (!host.querySelector(".inl-exit")){
    host.appendChild(el("button",{class:"inl-exit",
      html: svgIcon('<path d="M19 12H5M12 19l-7-7 7-7"/>')+"<span>"+esc(t("embed.back"))+"</span>",
      onclick:()=>navigate("dashboard")}));
  }
}
function screenRecall(view){ inlineScreen("recall", view); }
function screenFocus(view){ inlineScreen("focus", view); }
document.addEventListener("DOMContentLoaded", init);
